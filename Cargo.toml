[workspace]
members = [
    "crates/mesut",
    "crates/mesut-core",
    "crates/mesut-router",
    "crates/mesut-scheduler",
    "crates/mesut-runtime",
    "crates/mesut-executor",
    "crates/mesut-tokio",
    "crates/mesut-rayon",
    "crates/mesut-blocking",
    "crates/mesut-observe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Codex"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ELCI/mesut"

[workspace.dependencies]
mesut-core = { path = "crates/mesut-core" }
mesut-executor = { path = "crates/mesut-executor" }
mesut-router = { path = "crates/mesut-router" }
mesut-scheduler = { path = "crates/mesut-scheduler" }
mesut-runtime = { path = "crates/mesut-runtime" }
mesut-observe = { path = "crates/mesut-observe" }
mesut-tokio = { path = "crates/mesut-tokio" }
mesut-rayon = { path = "crates/mesut-rayon" }
mesut-blocking = { path = "crates/mesut-blocking" }

tokio = { version = "1.40", features = ["full"] }
rayon = "1.8"
num_cpus = "1.16"
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-trait = "0.1"
parking_lot = "0.12"
crossbeam = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
