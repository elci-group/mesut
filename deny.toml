# cargo-deny configuration for Mesut.
# The default config rejects everything not explicitly allowed; this file
# encodes the project's dependency policy: permissive OSS licenses only,
# known advisories block, yanked releases warn.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Entries require the RUSTSEC id; the advisory DB is fetched at check
    # time. Unmaintained advisories on transitive dev-only crates belong
    # here with a dated justification when they appear.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
